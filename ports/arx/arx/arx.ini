[config]
repeat_delay = 500
repeat_rate = 60
mouse_delay = 16
mouse_slow_scale = 50
deadzone_mode = default
deadzone_scale = 512
deadzone_x = 3000
deadzone_y = 3000
deadzone_triggers = 3000
dpad_mouse_normalize = true
absolute_center_x = 0
absolute_center_y = 0
absolute_step = 0

[controls]

overlay = "clear"

a = space
b = mouse_slow
x = ctrl
y = shift

r1 = mouse_left
r2 = mouse_right
r3 = c

l1 = hold_state strafe
l2 = hold_state lean
l3 = x

left_analog = arrow_keys repeat

up = up repeat
down = down repeat
left = left repeat
right = right repeat

right_analog = mouse_movement

select = esc
start = enter

[controls:strafe]
overlay = parent
right_analog_left  = a repeat
right_analog_right = d repeat

[controls:lean]
overlay = parent
right_analog_left  = q repeat
right_analog_right = e repeat
