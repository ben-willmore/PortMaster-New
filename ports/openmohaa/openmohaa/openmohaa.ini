[config]
repeat_delay = 500
repeat_rate = 60
mouse_delay = 16
mouse_slow_scale = 30
deadzone_mode = axial
deadzone_scale = 7
deadzone_x = 1000
deadzone_y = 1000
deadzone_triggers = 3000
dpad_mouse_normalize = true
absolute_center_x = 0
absolute_center_y = 0
absolute_step = 0

[controls]

overlay = "clear"

a = "mouse_left"
b = "mouse_right"
x = "space"
y = "ctrl"

l1 = "e"
l2 = "r"
l3 = "tab"
r1 = "shift"
r2 = "q"
start = "enter"
back = "esc" hold_state hk_hotkey

up = "w"
down = "s"
left = "a"
right = "d"

right_analog = mouse_movement

left_analog_up   = mouse_wheel_up repeat
left_analog_down = mouse_wheel_down repeat

[controls:hk_hotkey]

y = "f5"
a = "f9"
l1 = "1"
l2 = "2"
r1 = "3"
r2 = "4"
left_analog_up  = "5"
left_analog_left  = "6"
left_analog_right = "7"

overlay = "parent"
mouse_wheel_amount = 1
exclusive = parent

