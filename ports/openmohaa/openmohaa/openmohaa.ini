[config]
repeat_delay = 500
repeat_rate = 60
mouse_delay = 16
mouse_slow_scale = 30
deadzone_mode = axial
deadzone_scale = 10
deadzone_x = 1000
deadzone_y = 1000
deadzone_triggers = 3000
dpad_mouse_normalize = true
absolute_center_x = 0
absolute_center_y = 0
absolute_step = 0

[controls]

overlay = "clear"

a = "space"
b = "leftctrl"
x = "r"
y = "q"

l1 = ""
l2 = "mouse_right"
l3 = "shift"
r1 = ""
r2 = "mouse_left"
start = "enter"
back = "esc" hold_state hk_hotkey

up = "tab"
down = "e"
left = ""
right = ""

right_analog = mouse_movement

left_analog_up  = "w"
left_analog_down = "s"
left_analog_left  = "a"
left_analog_right = "d"

[controls:hk_hotkey]

a = ""
b = ""
x = "7"
y = ""
l1 = "5"
l2 = "f5"
r1 = "6"
r2 = "f9"
left_analog_up  = "1"
left_analog_right = "2"
left_analog_down = "3"
left_analog_left  = "4"

right_analog_up = mouse_wheel_up repeat
right_analog_down = mouse_wheel_down repeat

overlay = "parent"
mouse_wheel_amount = 1
exclusive = parent

